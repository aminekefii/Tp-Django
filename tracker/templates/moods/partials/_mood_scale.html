<aside class="card aside-card" aria-labelledby="mood-scale-title">
  <h2 id="mood-scale-title">The mood scale</h2>
  <ul class="tip-list">
    <li><span class="mood-dot mood-5" aria-hidden="true"></span><span><strong>Great</strong> — energised, joyful, at your best.</span></li>
    <li><span class="mood-dot mood-4" aria-hidden="true"></span><span><strong>Good</strong> — content and calm.</span></li>
    <li><span class="mood-dot mood-3" aria-hidden="true"></span><span><strong>Okay</strong> — neutral, nothing special.</span></li>
    <li><span class="mood-dot mood-2" aria-hidden="true"></span><span><strong>Low</strong> — tired, a little down.</span></li>
    <li><span class="mood-dot mood-1" aria-hidden="true"></span><span><strong>Very low</strong> — a hard day.</span></li>
  </ul>
  <p class="aside-note">Logging at the same time every day makes your statistics more meaningful.</p>
</aside>
